function referralPage(){const r=state.referral;const nextTarget=r.activated<1?1:r.activated<3?3:r.activated<5?5:r.activated<10?10:25;const level=r.activated>=25?'Diamond':r.activated>=10?'Gold':r.activated>=5?'Silver':r.activated>=3?'Bronze':'Starter';return `${pageHead('Your rewards','Invite real businesses. Earn points immediately when their store becomes active.',`<button class="btn btn-primary" data-action="share-referral">${ic('share')} Invite merchants</button>`)}<div class="reward-hero"><div class="reward-left"><span class="tag" style="color:#e2f6e7;background:#ffffff29">${ic('spark')} FOUNDING MERCHANT CIRCLE</span><h1>Grow the community.<br/>Build your advantage.</h1><p>Earn points for verified merchant activation. Unlock Founding status and future Discovery launch benefits—without cash deposits or misleading reputation scores.</p><button class="btn" data-action="share-referral" style="margin-top:17px;background:white;border-color:white;color:#136936">${ic('share')} Share referral link</button></div><div class="reward-stat"><span>YOUR TOTAL POINTS</span><strong>${r.points.toLocaleString()}</strong><span>${level} · ${r.activated} active referrals</span></div></div><div style="height:16px"></div><div class="grid cols-3">${metric('Verified referrals',r.activated,'users','Qualified activations · demo')}${metric('Pending invites',r.pending,'clock','Not yet earning points')}${metric('Founding tier',level,'trophy','Referral status, not reputation')}</div><div style="height:18px"></div><div class="split"><div class="card card-pad">${sectionHead('Your unique referral link','Share with another business owner; points unlock on activation')}<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input class="input" readonly value="${esc(referralLink())}" aria-label="Referral link" style="font-size:11px;min-width:0"/><button class="btn btn-primary" data-action="copy-referral">${ic('copy')} Copy</button></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-soft" data-action="share-referral">${ic('message')} Send invitation</button><button class="btn" data-action="copy-referral-message">${ic('copy')} Copy message</button></div><div style="height:19px"></div><div class="section-head"><h2>Your next milestone</h2><span class="tag">${level}</span></div><div style="display:flex;justify-content:space-between;gap:10px"><strong style="font-size:12px">${r.activated} / ${nextTarget} verified referrals</strong><small class="muted">${Math.max(0,nextTarget-r.activated)} to go</small></div><div class="level-bar"><div style="width:${Math.min(100,Math.round(100*r.activated/nextTarget))}%"></div></div><div class="note" style="margin-top:17px">The instant reward is real inside this prototype's local points ledger, but demo events are simulated. In production, points must be awarded server-side only after a unique merchant publishes a legitimate store with at least 5 products.</div></div><div class="card card-pad">${sectionHead('Try the reward experience','Safe simulator for UI evaluation')}<p class="muted" style="font-size:11px;line-height:1.7;margin-bottom:15px">See how people are rewarded. This does not create real accounts or publish any leaderboard.</p><button class="btn btn-full" data-action="simulate-join">${ic('plus')} Simulate a referral joining</button><button class="btn btn-primary btn-full" style="margin-top:10px" data-action="simulate-activation" ${r.pending<1?'disabled':''}>${ic('check')} Simulate verified activation (+100 pts)</button><div class="note warn" style="margin-top:14px">Simulator controls are deliberately limited to this demo. The real product must never have a client-controlled award-points button.</div></div></div><div style="height:18px"></div><div class="card card-pad">${sectionHead('Founding Merchant levels','Transparent milestones and future launch advantages')}<div class="level-grid">${[['🥉','Bronze','3 referrals','Founding badge'],['🥈','Silver','5 referrals','Limited launch visibility'],['🥇','Gold','10 referrals','Enhanced capped visibility'],['💎','Diamond','25 referrals','Highest capped launch benefit']].map(([em,name,req,desc],i)=>`<div class="level-card ${r.activated>=[3,5,10,25][i]?'active':''}"><div class="level-icon">${em}</div><strong>${name}</strong><small>${req}</small><small>${desc}</small></div>`).join('')}</div><div class="note" style="margin-top:17px"><strong>Fair ranking:</strong> Founding status is separate from trust reputation. Referral activity should never overpower product relevance, proximity, verified availability or legitimate customer experiences. Any future visibility advantage should be modest, time-limited and disclosed.</div></div><div style="height:18px"></div><div class="split"><div class="card card-pad">${sectionHead('Points history','Permanent event ledger concept')}<div class="horizontal-scroll"><table class="table"><thead><tr><th>Activity</th><th>When</th><th>Points</th></tr></thead><tbody>${r.ledger.slice().reverse().slice(0,8).map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.date)}</td><td style="color:#14894b;font-weight:800">+${x.points}</td></tr>`).join('')}</tbody></table></div></div><div class="card card-pad">${sectionHead('Local leaderboard','Illustration, not real participants')}<div class="rank-row"><span class="rank-num">1</span><div class="rank-avatar">A</div><div><strong>Sample merchant A</strong><small>Warri · example only</small></div><span class="rank-points">2,500 pts</span></div><div class="rank-row"><span class="rank-num">2</span><div class="rank-avatar">B</div><div><strong>Sample merchant B</strong><small>Effurun · example only</small></div><span class="rank-points">1,700 pts</span></div><div class="rank-row mine"><span class="rank-num">—</span><div class="rank-avatar" style="background:#d3eed9;color:#167837">O</div><div><strong>${esc(state.store.name)} (you)</strong><small>Local demo balance</small></div><span class="rank-points">${r.points} pts</span></div><div class="footnote" style=" le="color:#819582;font-size:11px;font-weight:800">DISCOVER LOCAL</span><span class="emoji">${s.emoji}</span></div><div class="body"><div class="tag gray" style="margin-bottom:9px">${esc(s.category)}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><div class="foot"><span>${ic('map')} ${esc(s.distance)}</span><span class="discover-preview">Preview</span></div><button class="btn btn-full" style="margin-top:15px" data-action="discovery-open" data-id="${s.id}">${ic('store')} View ${s.id==='s1'?'your shop':'sample store'}</button></div></div>`).join('')||`<div class="catalog-empty">No sample stores match these filters.</div>`}</div><div style="height:20px"></div><div class="split"><div class="card card-pad"><h2>How location-based discovery should work</h2><div class="task"><div class="task-mark">${ic('map')}</div><div><strong>Verified shop location</strong><small>Address and optional coordinates, with merchant consent</small></div></div><div class="task"><div class="task-mark">${ic('package')}</div><div><strong>Searchable product inventory</strong><small>Public, crawlable products with current availability</small></div></div><div class="task"><div class="task-mark">${ic('shield')}</div><div><strong>Trust based on evidence</strong><small>Verified orders, service quality and accurate listings</small></div></div><div class="task"><div class="task-mark">${ic('gift')}</div><div><strong>Founding visibility perk</strong><small>Small disclosed bonus, never a fake trust score</small></div></div></div><div class="card card-pad"><h2>Local AEO readiness</h2><p class="muted" style="font-size:11px;line-height:1.7;margin:10px 0 17px">To help AI-assisted search understand a store, the production system should publish valid merchant addresses, product pages, Product and LocalBusiness structured data, sitemaps and crawlable descriptions.</p><div class="note">Search indexing and AI citations are not guaranteed. This preview does not publish stores to ChatGPT, Google Maps or other search services.</div><button class="btn btn-soft" data-view="settings" style="margin-top:15px">${ic('map')} Review store location</button></div></div>`}

roduct-grid">${list.map(p=>productCard(p,'store')).join('')||`<div class="catalog-empty">No matching products.</div>`}</div><div style="height:25px"></div><div class="note">${ic('message')} This shop currently uses WhatsApp enquiry. Checkout and payment verification are not active in this prototype. Availability should be confirmed with the seller.</div></div></div>`}

levant products, not sponsored items disguised as organic</small></div></div><button class="btn btn-primary" style="margin-top:15px" data-action="reel-next">Show next product ${ic('arrow')}</button></div></div>`}
function visibilityPage(){const completed=[!!state.store.location,state.products.length>=5,!!state.store.description,false,false];return `${pageHead('Search visibility','Help search engines and AI-assisted discovery understand what your business offers.',`<span class="tag gold">Production integration required</span>`)}<div class="grid cols-3">${metric('Store readiness',completed.filter(Boolean).length+' / 5','check','Local checklist only')}${metric('Products with descriptions',state.products.filter(p=>p.desc).length+' / '+state.products.length,'package','Prototype catalogue')}${metric('AI search mentions','Not tracked','spark','No claim of AI recommendations')}</div><div style="height:18px"></div><div class="split"><div class="card card-pad">${sectionHead('Discoverability checklist','Practical prerequisites, not ranking guarantees')}${[['Provide your real business location','Customers searching nearby need accurate location','settings'],['List at least five genuine products','Customers need to know what is actually available','products'],['Write a useful business description','Explain your offers in plain language','settings'],['Publish crawlable product URLs','Requires live server-rendered/public pages','store'],['Add validated structured data and sitemap','Requires backend, Product + LocalBusiness schema','store']].map(([a,b,view],i)=>`<div class="task ${completed[i]?'done':''}" data-view="${view}"><span class="task-mark">${ic(completed[i]?'check':'clock')}</span><div><strong>${a}</strong><small>${b}</small></div><span class="arrow">${ic('chevron')}</span></div>`).join('')}</div><div class="card card-pad">${sectionHead('How AI could see your store','Illustrative public listing')}<div class="note" style="padding:17px;background:#f8faf8"><div class="tag">Local business</div><h2 style="font-size:18px;margin:12px 0 7px">${esc(state.store.name)}</h2><p style="font-size:12px;line-height:1.7">${esc(state.store.description)}</p><p style="font-size:11px;margin-top:12px">${ic('map')} ${esc(state.store.location)}</p><p style="font-size:11px;margin-top:9px">${ic('package')} ${state.products.length} products listed</p></div><div class="note warn" style="margin-top:15px">Publishing accurate information improves eligibility for discovery but cannot guarantee that ChatGPT, Gemini or Google recommends a store. Local proximity and relevance vary by platform.</div><button class="btn btn-soft" style="margin-top:15px" data-view="discovery">${ic('compass')} Preview Discovery</button></div></div><div style="height:18px"></div><div class="card card-pad">${sectionHead('Search and AI metadata — implementation blueprint','Examples of fields mySales should generate automatically')}<div class="horizontal-scroll"><table class="table"><thead><tr><th>Field</th><th>Source of truth</th><th>Status</th></tr></thead><tbody>${[['Store title and description','Merchant profile','Local data'],['Business address and optional coordinates','Verified merchant address','Backend needed'],['Product name, price, availability','Public product catalogue','Backend needed'],['Product / LocalBusiness JSON-LD','Server-rendered page','Not implemented'],['Public sitemap and robots.txt','Publishing service','Not implemented'],['Canonical URLs and Open Graph image','Public storefront pages','Not implemented']].map(([field,source,status])=>`<tr><td>${field}</td><td>${source}</td><td>${status}</td></tr>`).join('')}</tbody></table></div></div>`}
function landingPage(){return `<div style="max-width:1120px;margin:auto"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:27px"><div class="brand" style="margin:0"><div class="brandmark"><b>S</b></div><span class="brandtext">my<em>Sales</em></span></div><div style="display:flex;gap:8px"><button class="btn" data-view="auth">Log in</button><button class="btn btn-primary" data-view="auth">Create free shop ${ic('arrow')}</button></div></div><div class="hero" style="min-height:350px;align-items:center"><div style="max-width:620px"><span class="tag" style="background:#ffffff29;color:#fff">${ic('spark')} FOR SMALL BUSINESSES</span><h1 style="font-size:clamp(30px,5vw,48px);margin-top:17px">Your business deserves more than a WhatsApp chat.</h1><p style="font-size:14px">Create a simple online shop for free. Upload your products once, send one link to customers, and spend less time sending pictures and prices over and over.</p><div class="hero-actions"><button class="btn btn-primary btn-lg" data-view="auth">Create my free shop ${ic('arrow')}</button><button class="btn outline-light btn-lg" data-view="store">See a sample store</button></div></div><div class="hero-visual" style="align-self:center"><div style="font-size:120px;line-height:1">🛍️</div></div></div><div style="height:21px"></div><div class="grid cols-3"><div class="card card-pad"><div class="metric-icon" style="background:#e8f7ed;color:#22844a;display:grid;place-items:center;width:43px;height:43px;border-radius:12px;margin-bottom:18px">${ic('package')}</div><h3>All your products. One link.</h3><p class="muted" style="margin-top:9px;line-height:1.8;font-size:12px">Pictures, prices, descriptions and categories—all in a shop you can share.</p></div><div class="card card-pad"><div class="metric-icon" style="background:#e8f7ed;color:#22844a;display:grid;place-items:center;width:43px;height:43px;border-radius:12px;margin-bottom:18px">${ic('message')}</div><h3>Built for WhatsApp sellers</h3><p class="muted" style="margin-top:9px;line-height:1.8;font-size:12px">Share product details, promotional Status images and customer enquiry carts.</p></div><div class="card card-pad"><div class="metric-icon" style="background:#e8f7ed;color:#22844a;display:grid;place-items:center;width:43px;height:43px;border-radius:12px;margin-bottom:18px">${ic('gift')}</div><h3>Invite friends. Earn points.</h3><p class="muted" style="margin-top:9px;line-height:1.8;font-size:12px">Celebrate verified merchant referrals with instant Founding Points and clear future benefits.</p></div></div><div style="height:23px"></div><div class="card card-pad" style="text-align:center;padding:39px 20px"><span class="tag">HOW IT WORKS</span><h2 style="font-size:26px;margin:13px 0 26px">Start selling online in three simple steps</h2><div class="grid cols-3">${[['01','Tell us about your business','Name, category, location and WhatsApp number.'],['02','Add your products','Pictures, prices, descriptions and stock.'],['03','Share your shop link','Customers browse and send you enquiries.']].map(([no,a,b])=>`<div><span style="font:800 35px Manrope;color:#c3e7cc">${no}</span><h3 style="margin:8px 0">${a}</h3><p class="muted" style="font-size:11px;line-height:1.8">${b}</p></div>`).join('')}</div><button class="btn btn-primary btn-lg" style="margin-top:30px" data-view="auth">Get started free ${ic('arrow')}</button></div><div style="height:20px"></div><div class="note">This is a UI/UX prototype. The landing page and forms are local demos and are not connected to mySales production authentication or store publishing.</div></div>`}
function settingsPage(){return `${pageHead('Store settings','Your business identity, contact details and shop preferences.',`<button class="btn btn-primary" data-action="save-store">${ic('check')} Save changes</button>`)}<div class="split"><div><div class="card setting-group"><h3>Business profile</h3><p>Visible to customers on your shop page.</p><div class="field"><label>Business name</label><input class="input" id="set-name" value="${esc(state.store.name)}"/></div><div class="field"><label>Store description</label><textarea class="textarea" id="set-description">${esc(state.store.description)}</textarea></div><div class="form-grid"><div class="field"><label>Store category</label><input class="input" id="set-category" value="${esc(state.store.category)}"/></div><div class="field"><label>Opening hours</label><input class="input" id="set-hours" value="${esc(state.store.hours)}"/></div></div></div><div style="height:16px"></div><div class="card setting-group"><h3>Contact and fulfilment</h3><p>Accurate location helps customers find your business.</p><div class="field"><label>WhatsApp phone with country code</label><input class="input" id="set-whatsapp" value="${esc(state.store.whatsapp)}" placeholder="+234..."/></div><div class="field"><label>Business address / location</label><input class="input" id="set-location" value="${esc(state.store.location)}"/></div><div class="field"><label>Fulfilment branch</label><input class="input" id="set-branch" value="${esc(state.store.fulfilment)}"/></div><div class="form-grid"><div class="field"><label><input type="checkbox" class="checkbox-like" id="set-delivery" ${state.store.delivery?'checked':''}/> Offer delivery</label></div><div class="field"><label><input type="checkbox" class="checkbox-like" id="set-pickup" ${state.store.pickup?'checked':''}/> Offer pickup</label></div></div></div></div><div><div class="card setting-group"><h3>Shop appearance</h3><p>Customise your storefront colour.</p><div style="display:flex;gap:10px;margin-bottom:18px">${['#1c8220','#1976d2','#8b5cf6','#ca7533','#222d25'].map(c=>`<button aria-label="Colour ${c}" class="swatch ${state.store.accent===c?'active':''}" style="background:${c}" data-action="set-accent" data-color="${c}"></button>`).join('')}</div><div class="note">Brand colour selection is recorded in demo settings. Full storefront theme tokens would be connected in production.</div></div><div style="height:16px"></div><div class="card setting-group"><h3>Account and security</h3><p>Production account features should use Supabase Auth and secure RLS policies.</p><div class="setting-row"><div><strong>Email + password</strong><small>Planned Supabase authentication</small></div><span class="tag gray">Prototype only</span></div><div class="setting-row"><div><strong>Google Sign-In</strong><small>OAuth redirect configuration required</small></div><span class="tag gray">Prototype only</span></div><div class="setting-row"><div><strong>Tenant isolation</strong><small>Server-side organisation and store ownership</small></div><span class="tag gray">Backend required</span></div><button class="btn btn-full" style="margin-top:12px" data-view="auth">${ic('eye')} Preview sign-in flow</button></div><div style="height:16px"></div><div class="card setting-group"><h3>Demo controls</h3><p>Clear your local prototype data and restore initial sample products.</p><button class="btn" data-action="reset-demo">${ic('trash')} Reset demo data</button></div></div></div>`}

function onboardingPage(){const s=ui.onboardStep;const model=ui.onboard;return `<div class="onboarding"><div class="onboarding-top"><div class="brand" style="margin:0"><div class="brandmark"><b>S</b></div><span class="brandtext">my<em>Sales</em></span></div><button class="btn btn-sm" data-view="dashboard">${ic('close')} Exit preview</button></div><div class="steps">${[0,1,2,3].map(i=>`<div class="step ${i<=s?'active':''}"></div>`).join('')}</div><div class="onboard-center">${s===0?`<div class="eyebrow">LET'S GET YOU STARTED</div><h1>What would you like to do?</h1><p>Choose how you'd like to use mySales. You can change this later.</p><button class="type-choice" data-action="onboard-role" data-role="sell"><span class="choice-icon">${ic('store')}</span><span><strong>I want to sell</strong><span>Create a free shop, add products and start sharing.</span></span>${ic('arrow')}</button><button class="type-choice" data-action="onboard-role" data-role="buy"><span class="choice-icon">${ic('cart')}</span><span><strong>I want to buy</strong><span>Explore nearby stores and products (coming soon).</span></span>${ic('arrow')}</button>`:s===1?`<div class="eyebrow">STEP 1 OF 3</div><h1>Tell us about your business</h1><p>This helps customers recognise your store and understand what you sell.</p><form id="onboard-business"><div class="field"><label>Business name *</label><input name="name" class="input" required value="${esc(model.name||'')}" placeholder="e.g. Ada's Fashion House"/></div><div class="field"><label>What do you sell? *</label><input name="category" class="input" required value="${esc(model.category||'')}" placeholder="e.g. Beauty, electronics, groceries"/></div><div class="field"><label>Short description</label><textarea name="description" class="textarea" placeholder="Tell customers a little about your shop">${esc(model.description||'')}</textarea></div><div class="modal-foot" style="justify-content:space-between"><button type="button" class="btn" data-action="onboard-ba function growthMath(e){const n=e.prospects*(e.contactRate/100)*(e.signupRate/100)*(e.activationRate/100);const repeat=n*(e.retentionRate/100);const invite=n*(e.referRate/100)*e.referredPer*(e.referralActivationRate/100);return {reached:e.prospects*e.contactRate/100,signup:e.prospects*e.contactRate/100*e.signupRate/100,active:n,retained:repeat,referred:invite,total:n+invite}}

['Local discovery','Store-first list vs product-first search','Useful enquiry rate','Irrelevant or far-away results'],
['Status artwork','Single image optimized crop vs collage','Merchant repeat sharing','Misleading product photo crops']
].map(([a,b,c,d])=>`<article class="card g-panel"><div class="g-mini">PROPOSED EXPERIMENT</div><h3>${a}</h3><p>${b}</p><div class="g-divider"></div><small>Success metric</small><strong>${c}</strong><small>Guardrail</small><strong>${d}</strong><button class="btn" style="margin-top:13px" data-action="g-copy-experiment" data-exp="${esc(a)}">Copy experiment brief ${ic('copy')}</button></article>`).join('')}</div><div class="g-note">Instrument events before making causal claims. Use randomized assignments, deduplicated merchants, consent and a predeclared success metric.</div>`}
// Navigation integration: full Growth OS screens layered on top of the existing merchant demo.
Object.assign(pageNames,{journey:'Complete growth journey',acquisition:'Merchant acquisition',pipeline:'Prospect CRM',activation:'Activation playbook',campaigns:'Campaign studio',ambassadors:'Ambassador network',retention:'Retention engine',commerce:'Orders & checkout',network:'Network commerce',trust:'Trust & ranking',local:'Local Discovery/AEO',command:'Operator centre',loops:'Growth calculator',roadmap:'1M merchant roadmap',partners:'Partnerships',experiments:'Experiments'});
const originalSidebar=sidebar;
sidebar=function(){let raw=originalSidebar();return raw.replace('<div class="nav-label">WORKSPACE</div>',`<div class="nav-label">COMPLETE GROWTH SYSTEM</div>${navItem('journey','Full journey map','map')}${navItem('roadmap','Roadmap to 1M','chart')}${navItem('acquisition','Acquisition engine','users')}${navItem('pipeline','Merchant CRM','message')}${navItem('activation','Activation & setup','check')}${navItem('retention','Retention loops','clock')}${navItem('campaigns','Campaign studio','camera')}${navItem('partners','Partners & agents','users')}<div class="nav-label">WORKSPACE</div>`).replace('<div class="nav-label">GROW YOUR BUSINESS</div>',`<div class="nav-label">GROWTH & MARKETPLACE</div>${navItem('ambassadors','Ambassador program','gift')}${navItem('loops','Growth mathematics','chart')}${navItem('local','Local AEO playbook','map')}${navItem('commerce','Orders & fulfilment','cart')}${navItem('network','Supplier / publisher','package')}${navItem('trust','Reputation & safety','check')}${navItem('command','Operator command','settings')}${navItem('experiments','Experiments','spark')}`)};
const originalMobile=mobileBottom;
mobileBottom=function(){return originalMobile().replace('data-view="dashboard"','data-view="journey"').replace('Home</button>','Journey</button>')};
const originalModal=modal;
modal=function(){if(ui.modal==='g-new-lead')return `<div class="modal-overlay" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>New merchant prospect</h2><button class="modal-close" data-action="close-modal">${ic('close')}</button></div><form id="g-lead-form"><div class="field"><label>Merchant / business name *</label><input class="input" name="name" placeholder="e.g. Mercy Cakes" required/></div><div class="form-grid"><div class="field"><label>Acquisition source</label><select class="input" name="channel"><option>WhatsApp DM</option><option>Merchant referral</option><option>Field agent</option><option>Association partner</option><option>Social media</option></select></div><div class="field"><label>Area / location</label><input class="input" name="location" placeholder="Enerhen, Warri"/></div></div><div class="field"><label>Next step / conversation notes</label><textarea class="textarea" name="notes" placeholder="They want to see a demo"></textarea></div><div class="modal-foot"><button class="btn" data-action="close-modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save prospect</button></div></form></div></div>`;return originalModal()};
const originalRender=render;
render=function(keepScroll=false){const y=window.scrollY;const special={journey:journeyPage,acquisition:acquisitionPage,pipeline:pipelinePage,activation:activationPage,campaigns:campaignsPage,ambassadors:ambassadorsPage,retention:retentionPage,commerce:commercePage,network:networkPage,trust:trustPage,local:localPage,command:commandPage,loops:loopsPage,roadmap:roadmapPage,partners:partnersPage,experiments:experimentsPage};if(special[ui.view]){$('#app').innerHTML=`<div class="shell">${sidebar()}<main class="main">${header()}<div class="content">${special[ui.view]()}</div></main>${mobileBottom()}</div>${modal()}${cartDrawer()}${searchOverlay()}`;if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}else originalRender(keepScroll)};
const originalAction=action;
action=async function(name,el){switch(name){
 case'g-flow':ui.flowStep=Number(el.dataset.index)||0;render(true);return;
 case'g-next-step':ui.flowStep=(ui.flowStep+1)%gJourney.length;render(true);return;
 case'g-channel':ui.growthChannel=el.dataset.key;render(true);return;
 case'g-new-lead':ui.modal='g-new-lead';render(true);return;
 case'g-pipeline-filter':ui.pipelineStatus=el.dataset.value;render(true);return;
 case'g-lead-followup':{const l=G().leads.find(x=>x.id===el.dataset.id);if(l){await copyText(`Hi! I wanted to follow up about helping ${l.name} get a free online shop. I can show you a simple sample: https://store.mysalesofficial.com`)}return}
 case'g-copy-campaign':await copyText(channelStrategies.find(x=>x.key===ui.growthChannel)?.sample||'');return;
 case'g-tone':ui.outreachTone=el.dataset.tone;render(true);return;
 case'g-copy-message':await copyText(gMessage());return;
 case'g-preview-nudge':{const m=['Would you like help uploading your first five products?','Your shop is ready—send the link to an interested customer today.','See what customers showed interest in and reply while it is fresh.','Update stock and share your products to WhatsApp Status today.','We can help you refresh your shop if you have not been active.','Your real monthly shop insights are ready.'][Number(el.dataset.index)||0];await copyText(m);return}
 case'g-commerce-tab':G().commercePreview=el.dataset.key;growSave();render(true);return;
 case'g-add-demo-order':{const id='o'+Date.now();G().orders.unshift({id,buyer:'New sample customer',item:state.products[0]?.name||'Sample product',status:'Enquiry received',qty:1,channel:'WhatsApp',value:state.products[0]?.price||0});G().firstEnquiry=true;growSave();render(true);toast('Sample enquiry added. This is not a real customer.');return}
 case'g-network-role':ui.networkRole=el.dataset.role;render(true);return;
 case'g-network-example':toast('Future workflow: supplier approval, publisher opt-in, tracked order and verified commission ledger.');return;
 case'g-stage':ui.scaleStage=Number(el.dataset.stage);render(true);return;
 case'g-add-partner':G().partners.push({id:'a'+Date.now(),name:'New sample partner',type:'Association',status:'Prospecting',potential:20});growSave();render(true);toast('Sample partner added');return;
 case'g-copy-experiment':{const name=el.dataset.exp;await copyText(`mySales growth experiment: ${name}. Define hypothesis, randomized cohort, activated-merchant success metric, guardrail and release decision before rollout.`);return}
 default:return originalAction(name,el);
 }};
// Catch lead, campaign, funnel and local demo forms. No messages or sales events are sent to external services.
document.addEventListener('submit',e=>{const id=e.target.id;if(!['g-lead-form','g-campaign-form','g-funnel-form','g-local-form'].includes(id))return;e.preventDefault();const f=new FormData(e.target);if(id==='g-lead-form'){G().leads.unshift({id:'l'+Date.now(),name:String(f.get('name')||'').trim(),channel:String(f.get('channel')),location:String(f.get('location')||'Warri').trim(),status:'New lead',products:0,notes:String(f.get('notes')||'').trim(),date:'Today'});ui.modal='';ui.pipelineStatus='All';toast('Prospect saved locally');}
if(id==='g-campaign-form'){G().campaigns[0]={...G().campaigns[0],name:String(f.get('name')||''),channel:String(f.get('channel')||''),goal:Math.max(1,Number(f.get('goal')||1))};toast('Campaign draft saved locally');}
if(id==='g-funnel-form'){const econ=G().economics;for(const k in econ)econ[k]=Math.max(0,Math.min(k==='prospects'?1e8:k==='referredPer'?20:100,Number(f.get(k)||0)));toast('Scenario recalculated');}
if(id==='g-local-form'){G().launch={...G().launch,location:String(f.get('location')||''),product:String(f.get('product')||'')};toast('Example query updated. No live search performed.');}
growSave();render(true)});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-g-lead')){const l=G().leads.find(x=>x.id===e.target.dataset.gLead);if(l){l.status=e.target.value;growSave();render(true);toast('Prospect stage updated')}}if(e.target.hasAttribute('data-g-order')){const o=G().orders.find(x=>x.id===e.target.dataset.gOrder);if(o){o.status=e.target.value;growSave();render(true);toast('Sample order stage updated')}}});
// Local demonstration activation credit (production must be verified server-side).
function demoActivationCredit(){if(state.referral.onboardingBonus===false && state.products.length>=5 && G().firstShare){state.referral.onboardingBonus=true;state.referral.points+=50;state.referral.ledger.push({date:'Demo event',type:'Five products + first share completed',points:50});growSave();toast('🎉 Example +50 activation points! Production requires server verification.')}}
// Extend original actions with meaningful local demo merchant-value events.
const growthActions=action;
action=async function(name,el){await growthActions(name,el);if(['copy-store-link','share-store','copy-catalogue','whatsapp-catalogue','whatsapp-product','download-status','native-status-share','copy-product'].includes(name)){G().firstShare=true;growSave();demoActivationCredit()}if(name==='onboard-finish'){state.referral.points=0;state.referral.ledger=[];state.referral.onboardingBonus=false;growSave()}if(name==='add-cart'&&ui.view==='store'){G().firstEnquiry=true;growSave()}};
ui.view='journey';

render();
// All major workflows accessible on narrow phones through grouped mobile menu.
const gPrevModal=modal;
modal=function(){if(ui.modal==='mobile-menu'){const groups=[['START HERE',[['journey','Entire 17-stage journey','map'],['roadmap','Roadmap to 1 million','chart'],['landing','Public welcome page','globe'],['onboarding','Create a store','plus']]],['MERCHANT EXPERIENCE',[['dashboard','Store dashboard','home'],['products','Manage products','package'],['store','Customer view','store'],['share','WhatsApp share & Status','share'],['enquiries','Customer enquiries','message'],['analytics','Merchant analytics','chart'],['settings','Settings','settings']]],['GROWTH OPERATIONS',[['acquisition','Acquisition channels','users'],['pipeline','Prospect CRM','message'],['activation','Merchant activation','check'],['campaigns','Campaign templates','camera'],['retention','Retention playbooks','clock'],['ambassadors','Referral ambassadors','gift'],['referrals','Founding Points','gift'],['partners','Partnerships','users'],['loops','Growth simulator','chart'],['experiments','Growth experiments','spark']]],['FUTURE PLATFORM',[['commerce','Orders & payments','cart'],['discovery','Customer discovery','compass'],['local','Local SEO & AEO','search'],['visibility','Search visibility','search'],['network','Supplier / publisher','package'],['reels','Product reels','camera'],['trust','Safety and ranking','check'],['command','Operator centre','settings']]]];return `<div class="modal-overlay" data-action="modal-backdrop"><div class="modal g-menu-modal" role="dialog" aria-modal="true" aria-label="All mySales journeys"><div class="modal-head"><h2>Explore the entire mySales system</h2><button class="modal-close" data-action="close-modal">${ic('close')}</button></div>${groups.map(([label,items])=>`<div class="g-menu-label">${label}</div><div class="g-menu-links">${items.map(([view,name,icon])=>`<button data-view="${view}">${ic(icon)} ${name} ${ic('chevron')}</button>`).join('')}</div>`).join('')}</div></div>`}return gPrevModal()};
// A single direct route to the complete system from the merchant dashboard.
const gPreviousDashboard=dashboard;
dashboard=function(){return `<div class="g-dashboard-banner"><div><strong>Explore the entire mySales growth system</strong><p>Follow 17 stages from first lead to a retained seller, ambassador, marketplace and operator workflow.</p></div><button class="btn btn-primary" data-view="journey">${ic('arrow')} Open full journey</button></div>`+gPreviousDashboard()};
render();
// Capture navigation inside the modal before the generic backdrop click handler.
document.addEventListener('click',e=>{const target=e.target.closest('.g-menu-links [data-view]');if(!target)return;e.preventDefault();e.stopImmediatePropagation();ui.view=target.dataset.view;ui.modal='';ui.cartOpen=false;ui.searchOpen=false;render()},true);

// Award local sample activation bonus only after form submission and any prior first share.
document.addEventListener('submit',e=>{if(e.target.id==='product-form')setTimeout(demoActivationCredit,0)});
</script>
</body></html>
