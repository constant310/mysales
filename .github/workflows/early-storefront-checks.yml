name: Early Storefront checks
on:
  push:
    branches: [feature/early-storefront-vercel, release/product-photo-framing-20261019, feature/whatsapp-status-batch-20261020]
    paths:
      - 'storefront-demo/**'
      - '.github/workflows/early-storefront-checks.yml'
  workflow_dispatch:
jobs:
  storefront-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install storefront dependencies
        run: npm --prefix storefront-demo install --no-audit --no-fund
      - name: Validate customer photo framing and JavaScript syntax
        run: node --experimental-vm-modules --test storefront-demo/test/product-photo-release.test.mjs
      - name: Run automated storefront tests
        run: npm --prefix storefront-demo test
