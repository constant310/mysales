name: Early Storefront checks
on:
  push:
    branches: [feature/early-storefront-vercel, feature/storefront-account-login-v5]
    paths:
      - 'storefront-demo/**'
      - '.github/workflows/early-storefront-checks.yml'
  workflow_dispatch:
jobs:
  storefront-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install storefront dependencies
        run: npm --prefix storefront-demo install --no-audit --no-fund
      - name: Validate photo framing and browser module syntax
        run: node --experimental-vm-modules --test storefront-demo/test/photo-framing.test.mjs
      - name: Run automated storefront tests
        run: npm --prefix storefront-demo test
