name: Free AI motion clip test (mySales)
on:
  push:
    branches:
      - ai-video/mysales-zerogpu-test-20261009
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  generate_real_motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attempt open-source LTX real motion on free Hugging Face ZeroGPU
        shell: bash
        run: |
          python -m pip install --quiet gradio_client
          mkdir -p ai-motion-output
          cat >/tmp/generate_motion.py <<'PY'
          from gradio_client import Client
          import os, shutil, time
          print('Connecting to open-weight LTX video public demo...',flush=True)
          client=Client("Lightricks/ltx-video-distilled", verbose=True)
          print('Connected; available endpoints:',flush=True)
          client.view_api()
          prompt=("A cinematic handheld close-up in a small busy Nigerian neighborhood provision store, "
             "a worried Black Nigerian female shop owner in a mustard blouse leans over a counter, "
             "opens the cash till, counts banknotes quickly with both hands, stops and looks alarmed "
             "at the low amount, expressive natural facial and hand movement, fluorescent shop lights, "
             "colorful packaged goods on shelves, authentic documentary-style live-action, "
             "single continuous scene, highly realistic fluid motion, no dialogue, no subtitles, "
             "no logos, no text on screen, vertical video")
          # Public ZeroGPU is best-effort; not necessarily callable without an authenticated account.
          result=client.predict(
              prompt,
              "distorted hands, deformed fingers, motion blur, ugly, jarring jump cuts, captions, watermark",
              None,None,640,384,"text-to-video",2.5,9,12345,False,1.0,False,
              api_name="/text_to_video"
          )
          print('Prediction result:',str(result)[:800],flush=True)
          vid=result[0] if isinstance(result,(tuple,list)) else result
          if isinstance(vid,dict): vid=vid.get("video") or vid.get("path")
          if not vid or not os.path.exists(vid):
              raise RuntimeError('Inference did not return a valid video file')
          shutil.copy2(vid,'ai-motion-output/mysales_first_acting_clip.mp4')
          print('Saved generated clip',os.path.getsize('ai-motion-output/mysales_first_acting_clip.mp4'),flush=True)
          PY
          python /tmp/generate_motion.py
      - name: Upload video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mysales-actual-ai-motion-test
          path: ai-motion-output/
          retention-days: 7
