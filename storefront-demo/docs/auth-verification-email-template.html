<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Your mySales verification code</title></head>
<body style="margin:0;padding:28px;background:#f5faf6;font-family:Arial,Helvetica,sans-serif;color:#263e2e">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:auto;width:100%;max-width:520px;background:#ffffff;border-radius:16px">
<tr><td style="padding:32px">
<div style="font-size:24px;font-weight:800;color:#1C8220">mySales</div>
<h1 style="margin:22px 0 10px;font-size:25px;color:#213d2d">Verify your email</h1>
<p style="font-size:15px;line-height:1.6;color:#526357">Use this one-time code to sign in to mySales:</p>
<p style="margin:20px 0;padding:15px 18px;background:#F0FDF4;border:1px solid #bfe8cb;border-radius:12px;text-align:center;letter-spacing:7px;font-size:30px;font-weight:800;color:#15803D">{{ .Token }}</p>
<p style="font-size:14px;line-height:1.7;color:#526357">Alternatively, you can use this one-time sign-in link:</p>
<p style="margin:25px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;border-radius:9px;background:#1C8220;color:#ffffff;text-decoration:none;font-weight:700">Verify email &amp; continue</a></p>
<p style="font-size:13px;line-height:1.7;color:#728479">If you didn't request this, you can ignore it. Never share your verification code with anyone.</p>
</td></tr>
</table>
</body></html>
