<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover real businesses | mySales</title><style>body{font:16px/1.5 system-ui;margin:0;color:#21382b;background:#f5f8f5}header{background:#174d2c;color:white;padding:32px max(18px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:auto;padding:22px}input{width:100%;box-sizing:border-box;border:1px solid #cdd9d0;border-radius:10px;padding:15px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}.card{background:white;border:1px solid #dce6df;border-radius:14px;padding:22px}.card a{display:inline-block;background:#19733b;color:white;text-decoration:none;padding:10px 14px;border-radius:8px}small{color:#617568}#status{min-height:26px}</style></head><body><header><h1>Discover businesses</h1><p>Browse published merchant stores and their product catalogues.</p></header><main><label for="q">Find a business or product</label><input id="q" placeholder="Search by business name, category or product" maxlength="80"><p id="status" role="status">Loading businesses…</p><div class="grid" id="results"></div><p><small>Only stores published by their owners are shown. No sample businesses are presented as real merchants.</small></p></main><script type="module">
const input=document.querySelector('#q'),status=document.querySelector('#status'),results=document.querySelector('#results');let seq=0;
const el=(tag,value)=>{const node=document.createElement(tag);node.textContent=value;return node;};
async function load(){const id=++seq;status.textContent='Loading businesses…';results.replaceChildren();
try{const response=await fetch('/api/discover?q='+encodeURIComponent(input.value.trim()),{cache:'no-store'});if(!response.ok)throw Error('Unable to retrieve published stores');const data=await response.json();if(id!==seq)return;
status.textContent=data.stores.length+' published businesses found';
for(const store of data.stores){const card=el('article','');card.className='card';card.append(el('h2',store.name),el('p',store.description||'View this business catalogue.'),el('small',store.product_count+' listed products'));
const link=el('a','Visit store');link.href='/s/?slug='+encodeURIComponent(store.slug);card.append(el('p',''),link);results.append(card);}
if(!data.stores.length)results.append(el('p','No published businesses match your search yet.'));
}catch(e){if(id===seq)status.textContent='Live business listings are temporarily unavailable. Please try again later.';}}
let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,300);});load();
</script></body></html>
