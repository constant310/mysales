<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover real businesses | mySales</title><style>body{font:16px/1.5 system-ui;margin:0;color:#21382b;background:#f5f8f5}header{background:#174d2c;color:white;padding:32px max(18px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:auto;padding:22px}input{width:100%;box-sizing:border-box;border:1px solid #cdd9d0;border-radius:10px;padding:15px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}.card{background:white;border:1px solid #dce6df;border-radius:14px;padding:22px}.card a{display:inline-block;background:#19733b;color:white;text-decoration:none;padding:10px 14px;border-radius:8px}small{color:#617568}#status{min-height:26px}
:root{color:#374151;background:#F5FAFD}
header{background:#133D25;color:#fff}a{color:#15803D}
.mysales-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border-bottom:1px solid #E5E7EB;padding:12px max(15px,calc((100vw - 1050px)/2))}
.mysales-logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#18201b}.mysales-logo strong{color:#18201b;letter-spacing:-.055em;font-size:1.16rem}
.mysales-logo small{font-size:.72rem;color:#15803D;background:#F0FDF4;border-radius:20px;padding:5px}
.mysales-mark{background:#16A34A;color:#fff;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;letter-spacing:-.13em;padding-right:3px;font-weight:900}
.signup{background:#1C8220;color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:800;font-size:.8rem}
</style></head><body><div class="mysales-bar"><a href="/" class="mysales-logo"><span class="mysales-mark">mS</span><strong>mySales</strong><small>Storefronts</small></a><a class="signup" href="/create/">Create your store →</a></div><header><h1>Discover businesses</h1><p>Discover independent businesses using mySales Storefronts.</p></header><main><label for="q">Find a business or product</label><input id="q" placeholder="Search by business name, category or product" maxlength="80"><p id="status" role="status">Loading businesses…</p><div class="grid" id="results"></div><p><small>Only stores published by their owners are shown. No sample businesses are presented as real merchants.</small></p></main><script type="module">
const input=document.querySelector('#q'),status=document.querySelector('#status'),results=document.querySelector('#results');let seq=0;
const el=(tag,value)=>{const node=document.createElement(tag);node.textContent=value;return node;};
async function load(){const id=++seq;status.textContent='Loading businesses…';results.replaceChildren();
try{const response=await fetch('/api/discover?q='+encodeURIComponent(input.value.trim()),{cache:'no-store'});if(!response.ok)throw Error('Unable to retrieve published stores');const data=await response.json();if(id!==seq)return;
status.textContent=data.stores.length+' published businesses found';
for(const store of data.stores){const card=el('article','');card.className='card';card.append(el('h2',store.name),el('p',store.description||'View this business catalogue.'),el('small',store.product_count+' listed products'));
const link=el('a','Visit store');link.href='/'+encodeURIComponent(store.public_handle||store.slug);card.append(el('p',''),link);results.append(card);}
if(!data.stores.length)results.append(el('p','No published businesses match your search yet.'));
}catch(e){if(id===seq)status.textContent='Live business listings are temporarily unavailable. Please try again later.';}}
let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,300);});load();
</script></body></html>
