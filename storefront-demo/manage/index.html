<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Opening mySales Store Manager</title><style>body{font-family:system-ui,sans-serif;background:#f5faf6;color:#183e28;display:grid;min-height:100dvh;place-items:center;margin:0}main{padding:22px;text-align:center}a{color:#167c3e;font-weight:bold}</style></head><body><main><h1>Opening Store Manager…</h1><p>Please wait, or <a href="/account/manage/">open your dashboard</a>.</p></main><script type="module">
import {readLegacyProof,managerEntry} from '/auth/merchant-flow.mjs';
import {signedIn} from '/auth/client.mjs';
const hash=location.hash;
const mode=managerEntry({hash,accountSignedIn:signedIn(),legacyToken:readLegacyProof(sessionStorage,localStorage)});

location.replace(target);
</script></body></html>
