<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mySales | Merchant dashboard</title>
<style>body{font-family:system-ui;background:#f3f6f8;color:#152c37;margin:0}header{padding:18px 5%;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}main{max-width:1000px;margin:24px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:14px;margin-bottom:18px;border:1px solid #e1e6e8}label{display:block;margin:12px 0 5px}input,textarea{width:100%;padding:11px;box-sizing:border-box;border:1px solid #bac7cd;border-radius:8px;font:inherit}button{background:#087a7d;color:white;border:0;padding:11px 17px;border-radius:8px;cursor:pointer;margin-top:10px}button:disabled{opacity:.5}small{color:#657680}.product{padding:14px 0;border-bottom:1px solid #ddd}.flex{display:flex;gap:10px;flex-wrap:wrap}.flex>*{flex:1;min-width:110px}#logout{background:#425b65}#notice{min-height:22px}</style></head>
<body><header><strong>mySales · My Store</strong><button id="logout">Sign out</button></header><main>
<p id="notice" role="status">Checking private access…</p>
<div id="app" hidden>
<section class="card"><h1>Products</h1><p>Add products to your catalogue. New products stay unpublished until you choose to publish them.</p><div id="products"></div></section>
<section class="card"><h2>Add a product</h2><form id="new">
<label>Product name<input name="name" maxlength="150" required></label>
<label>Description<textarea name="description" maxlength="2000"></textarea></label>
<label>Category<input name="category" maxlength="80"></label>
<div class="flex"><div><label>Stock base unit<input name="baseUnit" value="piece" maxlength="40" required></label></div><div><label>Selling unit<input name="unitName" value="piece" maxlength="40" required></label></div></div>
<div class="flex"><div><label>Pieces per selling unit<input name="factor" type="number" min="1" step="1" value="1" required></label></div><div><label>Price (₦)<input name="price" type="number" min="0" step="1" required></label></div></div>
<button>Add product</button></form></section>
</div></main>
<script type="module">
const notice=document.getElementById('notice'),app=document.getElementById('app'),list=document.getElementById('products');
async function api(path,options={}){const r=await fetch('/api/merchant/'+path,{credentials:'same-origin',cache:'no-store',...options});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j;}
function el(tag,text){const e=document.createElement(tag);e.textContent=String(text);return e;}
async function refresh(){
 const {products}=await api('products');list.replaceChildren();
 if(!products.length)list.append(el('p','No products yet. Add your first product below.'));
 for(const p of products){
  const box=document.createElement('div');box.className='product';box.append(el('strong',p.name),el('p',(p.category||'Uncategorised')+' · Stock: '+p.stock+' '+p.base_unit));
  box.append(el('small',p.units.map(u=>u.name+': ₦'+Number(u.price).toLocaleString()+' ('+u.factor+' '+p.base_unit+')').join(' | ')));
  const form=document.createElement('form');form.className='flex';const inp=document.createElement('input');inp.type='number';inp.min='1';inp.step='1';inp.placeholder='Add stock in '+p.base_unit;inp.required=true;const btn=el('button','Restock');form.append(inp,btn);
  form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{await api('restock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:p.id,amount:Number(inp.value)})});notice.textContent='Stock updated';await refresh();}catch(err){notice.textContent=err.message;}finally{btn.disabled=false;}});
  box.append(form);
  const publish=el('button',p.published?'Hide from customers':'Publish to customers');
  publish.type='button';publish.style.marginLeft='8px';
  publish.addEventListener('click',async()=>{publish.disabled=true;try{await api('publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:p.id,published:!p.published})});notice.textContent='Visibility updated';await refresh();}catch(err){notice.textContent=err.message;publish.disabled=false;}});
  box.append(publish);list.append(box);
 }
}
document.getElementById('new').addEventListener('submit',async e=>{
 e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;
 const d=Object.fromEntries(new FormData(f));d.factor=Number(d.factor);d.price=Number(d.price);d.priceNgn=d.price;
 try{await api('products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});f.reset();notice.textContent='Product saved';await refresh();}
 catch(err){notice.textContent=err.message;}finally{b.disabled=false;}
});
document.getElementById('logout').addEventListener('click',async()=>{try{await api('logout',{method:'POST'});location.reload();}catch(e){notice.textContent=e.message;}});
try{await api('me');app.hidden=false;notice.textContent='Your private session is active.';await refresh();}
catch(e){notice.textContent='Cannot open your dashboard: '+e.message;}
</script></body></html>
