<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Merchant dashboard | mySales</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#14232d}
body{margin:0}header{background:#fff;border-bottom:1px solid #dfe6eb;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px}
main{max-width:900px;margin:40px auto;padding:0 20px}section{background:#fff;border:1px solid #dfe6eb;border-radius:16px;padding:26px}
button{padding:10px 16px;border:1px solid #d0d8dd;border-radius:8px;background:white;cursor:pointer}
p{line-height:1.6;color:#536174}h1{font-size:1.5rem}
</style></head>
<body><header><strong>mySales · Store Management</strong><button id="logout" hidden>Sign out</button></header>
<main><section><h1 id="heading">Checking your access…</h1><p id="status" role="status">Please wait.</p></section></main>
<script type="module">
const heading=document.getElementById('heading'),status=document.getElementById('status'),logout=document.getElementById('logout');
async function load(){
 try{
  const res=await fetch('/api/merchant/me',{credentials:'same-origin',cache:'no-store'});
  if(res.status===401){heading.textContent='Private access required';status.textContent='Open the management link sent by your store administrator.';return;}
  if(!res.ok)throw new Error('Service unavailable');
  const data=await res.json();
  if(!data.authenticated)throw new Error('Session invalid');
  heading.textContent='Your store dashboard';
  status.textContent='Your access is active. Product and inventory management tools are coming next.';
  logout.hidden=false;
 }catch{heading.textContent='Unable to load your store';status.textContent='Please try again shortly.';}
}
logout.addEventListener('click',async()=>{
 logout.disabled=true;
 try{const r=await fetch('/api/merchant/logout',{method:'POST',credentials:'same-origin'});if(!r.ok)throw Error();location.reload();}
 catch{status.textContent='Sign out failed. Please try again.';logout.disabled=false;}
});
load();
</script></body></html>
