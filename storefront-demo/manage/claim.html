<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>Open your store management | mySales</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#f5f7fa}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}
main{background:white;border:1px solid #e6eaf0;border-radius:18px;padding:30px;max-width:460px;width:100%;box-shadow:0 14px 45px #17202a12}
h1{font-size:1.5rem;margin:0 0 12px}p{line-height:1.6;color:#536174}
button{background:#116f76;border:0;color:white;border-radius:10px;padding:14px 18px;font:inherit;font-weight:650;width:100%;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}a{color:#116f76}
</style>
</head>
<body><main>
<h1>Manage your store</h1>
<p id="status" role="status">Checking your private management link…</p>
<button id="claim" hidden>Open my dashboard</button>
</main>
<script type="module">
const status=document.getElementById('status');
const button=document.getElementById('claim');
const params=new URLSearchParams(location.hash.replace(/^#/, ''));
const token=params.get('token');
// Remove bearer secret from the address bar immediately.
history.replaceState(null,'',location.pathname);
if(!token || !/^[A-Za-z0-9_-]{43}$/.test(token)){
 status.textContent='This management link is missing or invalid. Ask your store administrator for a new link.';
}else{
 status.textContent='Your private link is ready. Select below to access your store.';
 button.hidden=false;
 button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='Opening your store securely…';
  try{
   const response=await fetch('/api/merchant/claim',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({token})});
   if(!response.ok){status.textContent='This link has expired, was already used, or has been revoked. Request a new link.';button.hidden=true;return;}
   location.replace('/manage/');
  }catch{status.textContent='Unable to connect. Check your internet and try again.';button.disabled=false;}
 });
}
</script>
</body></html>
