</head><body><main><h1>Your store is moving to login</h1><p>Please sign in with your email. Your existing products and store will be kept.</p><p id="notice">Redirecting to login…</p><a href="/login/">Continue to login</a></main>
<script>
const code=new URLSearchParams(location.hash.slice(1)).get('token')||'';
if(/^[A-Za-z0-9_-]{43}$/.test(code))try{sessionStorage.setItem('mysales_legacy_claim_proof',code);}catch{}
